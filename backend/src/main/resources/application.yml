server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: cold-chain-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cold_chain}
    username: ${DB_USER:coldchain_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    user: ${FLYWAY_USER:coldchain_migrator}
    password: ${FLYWAY_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  auth:
    operations-password: ${COLDLATCH_OPERATIONS_PASSWORD:}
    analyst-password: ${COLDLATCH_ANALYST_PASSWORD:}
  frontend-origin: ${COLDLATCH_FRONTEND_ORIGIN:http://localhost:3000}
  rules:
    default-allowed-lateness-minutes: 120
    default-cadence-minutes: 5
