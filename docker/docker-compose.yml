services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cold_chain
      POSTGRES_USER: coldchain_admin
      POSTGRES_PASSWORD: ${COLDCHAIN_ADMIN_PASSWORD:?Set COLDCHAIN_ADMIN_PASSWORD in docker/.env}
      COLDCHAIN_ADMIN_PASSWORD: ${COLDCHAIN_ADMIN_PASSWORD:?Set COLDCHAIN_ADMIN_PASSWORD in docker/.env}
      COLDCHAIN_MIGRATOR_PASSWORD: ${COLDCHAIN_MIGRATOR_PASSWORD:?Set COLDCHAIN_MIGRATOR_PASSWORD in docker/.env}
      COLDCHAIN_APP_PASSWORD: ${COLDCHAIN_APP_PASSWORD:?Set COLDCHAIN_APP_PASSWORD in docker/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
      - ../database/provision-roles.sql:/docker-entrypoint-initdb.d/provision-roles.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain_admin -d cold_chain"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cold_chain
      DB_USER: coldchain_app
      DB_PASSWORD: ${COLDCHAIN_APP_PASSWORD:?Set COLDCHAIN_APP_PASSWORD in docker/.env}
      FLYWAY_USER: coldchain_migrator
      FLYWAY_PASSWORD: ${COLDCHAIN_MIGRATOR_PASSWORD:?Set COLDCHAIN_MIGRATOR_PASSWORD in docker/.env}
      COLDLATCH_OPERATIONS_PASSWORD: ${COLDLATCH_OPERATIONS_PASSWORD:?Set COLDLATCH_OPERATIONS_PASSWORD in docker/.env}
      COLDLATCH_ANALYST_PASSWORD: ${COLDLATCH_ANALYST_PASSWORD:?Set COLDLATCH_ANALYST_PASSWORD in docker/.env}
      COLDLATCH_FRONTEND_ORIGIN: ${COLDLATCH_FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80" # Map 3000 to Nginx port 80 for production React build
    depends_on:
      - backend

volumes:
  postgres_data:
